<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웨이브즈작</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        #game-area {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .game-title {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            background-image: url('assets/images/1.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .game-title h1 {
            font-size: 96px;
            color: #ffffff;
            text-shadow: 6px 6px 12px rgba(0, 0, 0, 1), 0 0 20px rgba(102, 126, 234, 0.5);
            margin-bottom: 80px;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 4px;
            animation: titlePulse 2s ease-in-out infinite;
        }
        @keyframes titlePulse {
            0%, 100% {
                transform: scale(1);
                text-shadow: 6px 6px 12px rgba(0, 0, 0, 1), 0 0 20px rgba(102, 126, 234, 0.5);
            }
            50% {
                transform: scale(1.02);
                text-shadow: 6px 6px 12px rgba(0, 0, 0, 1), 0 0 30px rgba(102, 126, 234, 0.8);
            }
        }
        .game-title button {
            pointer-events: auto;
            font-size: 36px;
            padding: 24px 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), 0 0 30px rgba(102, 126, 234, 0.3);
            letter-spacing: 3px;
            transition: all 0.3s ease;
            animation: buttonFloat 3s ease-in-out infinite;
        }
        @keyframes buttonFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .game-title button:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), 0 0 50px rgba(102, 126, 234, 0.6);
            border-color: rgba(255, 255, 255, 0.6);
        }
        .game-title button:active {
            transform: translateY(-2px) scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="game-title" id="gameTitle">
                <h1>웨이브즈작</h1>
                <button id="startBtn">GAME START</button>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/door.js"></script>
    <script src="js/room.js"></script>
    <script src="js/dungeon.js"></script>
    <script src="js/minimap.js"></script>
    <script src="js/player.js"></script>
    <script src="js/projectile.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/item.js"></script>
    <script src="js/star.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
